name: Sync Data & Static Files

# Syncs everything for BOTH portfolios in a single run:
# 1. Downloads the existing Cloudinary mapping from the 'data' branch (warm cache)
# 2. Fetches data from Airtable ONCE for both directing & postproduction (5 API calls)
# 3. Syncs new images to Cloudinary (cache-first, only uploads genuinely new images)
# 4. Generates static files (portfolio-data.json, sitemap.xml, robots.txt) per domain
# 5. Pushes artifacts to the dedicated 'data' branch → jsDelivr CDN auto-updates

on:
  repository_dispatch:
    types: [airtable-webhook-sync]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for sync (optional)'
        required: false
        default: 'Manual content sync'
      rollback:
        description: 'Rollback: tag or commit SHA to restore (leave blank for a normal sync)'
        required: false
        default: ''

permissions:
  contents: write

# Never run two publishes at once: the older run must not finish last and
# overwrite newer data. Queue instead of cancelling a run in progress.
concurrency:
  group: sync-data
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ !inputs.rollback }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Restore Cloudinary mapping cache
        run: |
          echo "📦 Downloading existing Cloudinary mapping from data branch..."
          curl -sL "https://cdn.jsdelivr.net/gh/gabathanasiou/gabriel-portfolio-data@data/cloudinary-mapping.json" \
            -o cloudinary-mapping.json 2>/dev/null || echo "{}" > cloudinary-mapping.json
          if [ -s cloudinary-mapping.json ] && python3 -c "import json; json.load(open('cloudinary-mapping.json'))" 2>/dev/null; then
            echo "✅ Loaded existing mapping ($(wc -c < cloudinary-mapping.json | tr -d ' ') bytes)"
          else
            echo "ℹ️ No existing mapping found, starting fresh"
            echo '{"generatedAt":"","projects":[],"journal":[],"config":{"images":[]}}' > cloudinary-mapping.json
          fi

      - name: Restore previous published snapshots
        run: |
          # Used by the publish gate to detect empty/misconfigured payloads and
          # abrupt count drops. Absent on the very first publish.
          mkdir -p ../previous
          for mode in directing postproduction; do
            curl -sfL --max-time 30 "https://cdn.jsdelivr.net/gh/$GITHUB_REPOSITORY@data/$mode/portfolio-data.json" \
              -o "../previous/$mode.json" \
              || { echo "ℹ️ No previous $mode snapshot"; rm -f "../previous/$mode.json"; }
          done

      - name: Sync all portfolio data & images
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN || secrets.AIRTABLE_API_KEY }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          USE_CLOUDINARY: 'true'
        run: |
          echo "🔄 Syncing all portfolio data (single Airtable fetch)..."
          npm run sync:all
          echo "✅ All portfolio data synced!"

      - name: Publish gate
        run: node scripts/check-publish.mjs --previous ../previous

      - name: Sync Instagram Studio (optional)
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN || secrets.AIRTABLE_API_KEY }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          echo "📸 Attempting Instagram Studio sync..."
          if [ -f "scripts/instagram-studio-data-backup.json" ] && [ -f "scripts/upload-instagram-data.mjs" ]; then
            node scripts/upload-instagram-data.mjs
          else
            echo "ℹ️ Skipping Instagram Studio Upload: Backup file or script missing."
          fi

      - name: Deploy Data to 'data' branch
        id: publish
        run: |
          # 1. Prepare the artifact stage (build output plus the data branch's
          #    own .gitignore, so a later checkout of `data` cannot stage secrets)
          rm -rf ../stage
          mkdir -p ../stage
          if [ -d "directing" ]; then cp -r directing ../stage/; fi
          if [ -d "postproduction" ]; then cp -r postproduction ../stage/; fi
          if [ -f "cloudinary-mapping.json" ]; then cp cloudinary-mapping.json ../stage/; fi
          cp .github/data-branch.gitignore ../stage/.gitignore

          # 2. Refuse to publish anything that is not a generated artifact.
          #    Fails on .env*, node_modules/, SCHEMA-FULL.local.md or any
          #    path outside directing/, postproduction/, cloudinary-mapping.json.
          node scripts/guard-data-branch.mjs ../stage

          # 3. Append the publish to the existing `data` history and tag it.
          #    No force-push: history is kept for `git revert` and rollback.
          #    `changed` is a real content comparison, not a directory-exists check.
          node scripts/publish-data.mjs publish --stage ../stage --github-output "$GITHUB_OUTPUT"

      - name: Purge jsDelivr Cache
        if: steps.publish.outputs.changed == 'true'
        run: |
          echo "⏳ Waiting 30s for CDN propagation before purging..."
          sleep 30
          echo "🧹 Purging jsDelivr cache..."
          # Directing
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@data/directing/portfolio-data.json"
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@data/directing/sitemap.xml"
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@data/directing/robots.txt"
          # Post-Production
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@data/postproduction/portfolio-data.json"
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@data/postproduction/sitemap.xml"
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@data/postproduction/robots.txt"
          echo "✅ Cache purged for all static files"

  rollback:
    if: ${{ inputs.rollback != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Restores the artifacts from <ref> as a NEW commit on `data`, so the
      # rollback is append-only and can itself be rolled back.
      - name: Restore 'data' to the requested snapshot
        run: node scripts/publish-data.mjs rollback --ref "${{ inputs.rollback }}"

      - name: Purge jsDelivr Cache
        run: |
          echo "⏳ Waiting 30s for CDN propagation before purging..."
          sleep 30
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@data/directing/portfolio-data.json"
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@data/directing/sitemap.xml"
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@data/directing/robots.txt"
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@data/postproduction/portfolio-data.json"
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@data/postproduction/sitemap.xml"
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@data/postproduction/robots.txt"
          echo "✅ Cache purged for all static files"
